name: WebDAV transport tests

# Runs the plugin test suites (suites 1–3) against the live WebDAV server.
# Does NOT require a full cmake build: the Makefile ci-live target compiles
# the plugin .so files directly with g++.
#
# Required repository secrets:
#   WEBDAV_TEST_USER  — basic-auth username for webdav.critchley.biz
#   WEBDAV_TEST_PASS  — basic-auth password for webdav.critchley.biz

on:
  push:
    branches: [webdav]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-tests:
    runs-on: ubuntu-latest

    env:
      WEBDAV_URL: https://webdav.critchley.biz/test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install libcurl development headers
      run: sudo apt-get install -y libcurl4-openssl-dev pkg-config

    - name: Write ~/.netrc for WebDAV credentials
      # Credentials come from repository secrets so they are never echoed in logs.
      # chmod 600 is required — libcurl refuses to read a world-readable netrc.
      run: |
        echo "machine webdav.critchley.biz login ${{ secrets.WEBDAV_TEST_USER }} password ${{ secrets.WEBDAV_TEST_PASS }}" > ~/.netrc
        chmod 600 ~/.netrc

    - name: Verify server is reachable
      # A quick HEAD on the seed file; if the server is down the live tests
      # are skipped rather than failing the build with a spurious error.
      id: check_server
      run: |
        if curl --silent --netrc --head --max-time 10 \
               "${WEBDAV_URL}/pwsafe_test.psafe3" | grep -q "^HTTP.*200"; then
          echo "reachable=true" >> "$GITHUB_OUTPUT"
        else
          echo "reachable=false" >> "$GITHUB_OUTPUT"
          echo "WARNING: WebDAV server unreachable — live tests will be skipped"
        fi

    - name: Build plugin .so files and test binaries
      if: steps.check_server.outputs.reachable == 'true'
      run: make -f Makefile.transport-tests build-plugins build

    - name: Suite 1 — standalone transport infrastructure (offline)
      if: steps.check_server.outputs.reachable == 'true'
      run: make -f Makefile.transport-tests suite1

    - name: Suite 2 — WebDAV plugin (live server)
      if: steps.check_server.outputs.reachable == 'true'
      run: make -f Makefile.transport-tests suite2

    - name: Suite 3 — lock lifecycle (live server)
      if: steps.check_server.outputs.reachable == 'true'
      run: make -f Makefile.transport-tests suite3

    - name: Summarise
      if: steps.check_server.outputs.reachable == 'true'
      run: echo "All transport test suites passed against $WEBDAV_URL"
